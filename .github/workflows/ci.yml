name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (offline components only — no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,data,dev]"
      - name: Lint
        run: ruff check src tests app scripts
      - name: Tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          halludetect search "weapons cannot cut the soul" --k 3
          halludetect verify -q "Which verse says the soul cannot be cut by weapons?" -a "The soul cannot be cut by weapons. This is described in BG 2.20."
